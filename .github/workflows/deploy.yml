# La fiecare push pe main: verificări (tipuri + lint), apoi deploy pe server prin SSH (rulează deploy/deploy.sh de pe server).
# Secrete (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_KEY (cheia PRIVATĂ a unui utilizator de deploy), APP_DIR (calea clonei pe server),
#   opțional: SSH_PORT (22), SSH_KNOWN_HOSTS (ieșirea `ssh-keyscan -p PORT HOST`; recomandat — altfel se ia cheia serverului la prima conectare).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy prin SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" "$SSH_HOST" > ~/.ssh/known_hosts; fi
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" "cd '$APP_DIR' && ./deploy/deploy.sh"
